<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAF PRF</title>
<meta name="description" content="Acompanhe seus treinos do TAF da PRF: pontos, metas do edital 2021, gráficos e cronômetros.">
<meta name="theme-color" content="#1d4a7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TAF PRF">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de celular, uma tela por aba, barra de abas fixa embaixo.
   Identidade: sinalização rodoviária (amarelo de faixa sobre azul-tinta), números grandes em condensada. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #14202e;
  --muted: #5a6878;
  --line: #d8dee6;
  --brand: #1d4a7a;
  --accent: #f2b705;
  --accent-ink: #14202e;
  --good: #1b7f47;
  --good-bg: #dcf1e5;
  --info: #1d4a7a;
  --info-bg: #dde8f4;
  --bad: #b3372b;
  --bad-bg: #f8e1de;
  --none-bg: #e6e9ee;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141c; --surface: #162029; --surface-2: #1d2a36; --ink: #e8edf3; --muted: #93a1b2;
    --line: #263443; --brand: #74abe2; --accent: #f2b705; --accent-ink: #14202e;
    --good: #5fcf8f; --good-bg: #17382a; --info: #8dbbea; --info-bg: #1b3350;
    --bad: #f0877b; --bad-bg: #432421; --none-bg: #232f3b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141c; --surface: #162029; --surface-2: #1d2a36; --ink: #e8edf3; --muted: #93a1b2;
  --line: #263443; --brand: #74abe2; --accent: #f2b705; --accent-ink: #14202e;
  --good: #5fcf8f; --good-bg: #17382a; --info: #8dbbea; --info-bg: #1b3350;
  --bad: #f0877b; --bad-bg: #432421; --none-bg: #232f3b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 104px; max-width: 560px; margin: 0 auto; -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* cabeçalho */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; flex: none; }
.foto { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--accent); }
.foto-edit { display: flex; align-items: center; gap: 14px; }
.foto-edit .foto { width: 72px; height: 72px; }
.foto-edit .mark { width: 72px; height: 72px; }
.foto-btns { display: grid; gap: 8px; }
.mark i { display: block; width: 6px; height: 22px; background: var(--accent); border-radius: 2px; transform: skewX(-14deg); box-shadow: 10px 0 0 var(--accent), -10px 0 0 var(--accent); opacity: .95; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.brand p { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 32px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #0d141c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0d141c; } }

/* resumo */
.hero { background: var(--brand); color: #fff; border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
:root[data-theme="dark"] .hero { background: #1c3a5c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { background: #1c3a5c; } }
.hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero .big { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: .9; }
.hero .big small { font-size: 28px; opacity: .75; margin-left: 4px; }
.hero .lbl { font-size: 14px; opacity: .85; text-align: right; }
.dots { display: flex; gap: 6px; }
.dots span { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.25); }
.dots span.on { background: var(--accent); }

.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 22px 2px 10px; }
.section-h h2 { font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; }
.section-h span { font-size: 13px; color: var(--muted); }

/* cartões de teste */
.tests { display: grid; gap: 10px; }
.test { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: left; width: 100%; cursor: pointer; }
.test[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.t-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.t-name { font-weight: 600; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--good-bg); color: var(--good); }
.pill.go { background: var(--info-bg); color: var(--info); }
.pill.no { background: var(--none-bg); color: var(--muted); }
.t-vals { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.t-last { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1; }
.t-last small { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 4px; }
.t-meta { text-align: right; font-size: 13px; color: var(--muted); }
.t-meta b { color: var(--ink); font-weight: 600; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
.bar.full i { background: var(--good); }
.t-foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 8px; }
.delta.up { color: var(--good); font-weight: 600; }
.delta.down { color: var(--bad); font-weight: 600; }

/* gráfico */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 0 16px; min-height: 40px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #0d141c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #0d141c; } }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px 10px; }
.chart h3 { font-weight: 600; padding-inline: 6px; }
.chart .sub { font-size: 13px; color: var(--muted); padding: 0 6px 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .meta-l { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .meta-t { fill: var(--good); font-size: 11px; font-weight: 600; }
.chart .ln { stroke: var(--brand); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--brand); opacity: .12; }
.chart .pt { fill: var(--surface); stroke: var(--brand); stroke-width: 2; }
.chart .pt.last { fill: var(--accent); stroke: var(--brand); }
.chart .val { fill: var(--ink); font-size: 11px; font-weight: 600; }
.empty { padding: 24px 12px; text-align: center; color: var(--muted); }

/* formulário */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.field input, .field select, .field textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 48px; width: 100%; min-width: 0; }
.field textarea { min-height: 76px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 12px; color: var(--muted); }
.btn { border: 0; border-radius: 12px; min-height: 50px; padding: 0 18px; font-weight: 700; font-size: 16px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.msg { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--info-bg); color: var(--info); }
.msg.err { background: var(--bad-bg); color: var(--bad); }
.msg.ok { background: var(--good-bg); color: var(--good); }

/* histórico */
.list { display: grid; gap: 10px; }
.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.s-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.s-date { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.s-vals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.s-vals div { background: var(--surface-2); border-radius: 10px; padding: 8px 4px; text-align: center; min-width: 0; }
.s-vals b { display: block; font-family: var(--font-display); font-size: 19px; line-height: 1.1; }
.s-vals span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.s-obs { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.s-act { display: flex; gap: 8px; }
.s-act .btn { min-height: 40px; font-size: 14px; flex: 1; }

/* metas */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
td.n { font-variant-numeric: tabular-nums; font-weight: 600; }
.mi { width: 88px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
td.mine, th.mine { background: var(--info-bg); color: var(--info); }
.note { font-size: 13px; color: var(--muted); padding: 2px; }

/* melhorias */
.pills { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill.pts { background: var(--accent); color: var(--accent-ink); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.hero-note { font-size: 13px; opacity: .9; }
.strip { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
.strip span { font-size: 13px; color: var(--muted); }
.strip b { font-family: var(--font-display); font-size: 24px; letter-spacing: .02em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; }
.stats b { display: block; font-family: var(--font-display); font-size: 34px; line-height: 1; }
.stats span { font-size: 12px; color: var(--muted); }
.extra { display: grid; gap: 4px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.extra b { color: var(--ink); }
.cr { margin-bottom: 14px; }
.cr-time { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1; text-align: center; letter-spacing: .02em; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.chk input { width: 20px; height: 20px; flex: none; }
.seg2 { display: flex; gap: 8px; flex-wrap: wrap; }
.fxgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fxi { width: 100%; }

/* barra de abas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); z-index: 5; }
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 8px 2px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 54px; cursor: pointer; }
.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--brand); background: var(--info-bg); }
.sync { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; }
@media (max-width: 380px) { .s-vals b { font-size: 16px; } .hero .big { font-size: 54px; } }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs"><nav id="tabs" aria-label="Seções"></nav></div>

<script>
(function () {
  "use strict";

  // ---------- Metas do edital 2021 (da planilha) ----------
  var TESTS = [
    { id: "barra", nome: "Barra fixa", curto: "Barra", dir: 1, dec: 0, m: 3, f: 10, fx: { m: [4, 5, 6, 7, 8, 9], f: [13, 16, 19, 22, 25, 28] },
      un: function (s) { return s === "f" ? "s" : "rep"; },
      unLong: "repetições (masc.) / segundos de suspensão (fem.)", obs: "Masculino: repetições. Feminino: suspensão em segundos.", melhor: "Maior" },
    { id: "shuttle", nome: "Shuttle run", curto: "Shuttle", dir: -1, dec: 2, m: 13.99, f: 15.99, fx: { m: [13.49, 12.99, 12.49, 11.99, 11.49, 10.99], f: [15.49, 14.99, 14.49, 13.99, 13.49, 12.99] },
      un: function () { return "s"; }, unLong: "segundos", obs: "Tempo de execução.", melhor: "Menor" },
    { id: "impulsao", nome: "Impulsão horizontal", curto: "Impulsão", dir: 1, dec: 2, m: 2.01, f: 1.61, fx: { m: [2.06, 2.11, 2.16, 2.21, 2.26, 2.31], f: [1.66, 1.71, 1.76, 1.81, 1.86, 1.91] },
      un: function () { return "m"; }, unLong: "metros", obs: "Distância alcançada.", melhor: "Maior" },
    { id: "abdominal", nome: "Abdominal", curto: "Abdom.", dir: 1, dec: 0, m: 35, f: 28, fx: { m: [39, 43, 47, 51, 55, 59], f: [31, 34, 37, 40, 43, 46] },
      un: function () { return "rep"; }, unLong: "repetições", obs: "Execuções válidas em 1 minuto.", melhor: "Maior" },
    { id: "corrida", nome: "Corrida 12 min", curto: "Corrida", dir: 1, dec: 0, m: 2301, f: 2001, fx: { m: [2401, 2501, 2601, 2701, 2801, 2901], f: [2101, 2201, 2301, 2401, 2501, 2601] },
      un: function () { return "m"; }, unLong: "metros", obs: "Distância percorrida em 12 minutos.", melhor: "Maior" }
  ];
  var TIPOS = ["Treino", "Avaliação", "Simulado"];
  var SEED = [];
  var AVISO = "Baseado no edital PRF 2021 (Anexo III). Confira sempre o edital vigente. App independente, sem vínculo com a PRF, que não substitui a orientação de um profissional.";

  // ---------- Estado e armazenamento ----------
  var state = {
    tab: "painel", sel: "barra", sessoes: [], editId: null, confirmDel: null, msg: null,
    perfil: { nome: "", sexo: "m", objetivo: "", inicio: "", configurado: false },
    storage: "local", ready: false, perfilLoaded: false
  };
  var db = null, perfilRef = null, sessCol = null;

  function lsGet(k, fb) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function loadLocal() {
    state.storage = "local";
    state.sessoes = lsGet("taf.sessoes", SEED);
    state.perfil = lsGet("taf.perfil", state.perfil);
    state.ready = true;
    render();
  }

  function applySnap(snap) {
    var list = snap.docs.map(function (d) { return Object.assign({}, d.data() || {}, { id: d.id }); });
    var changed = JSON.stringify(list) !== JSON.stringify(state.sessoes) || state.storage !== "db" || !state.ready;
    state.sessoes = list; lsSet("taf.sessoes", list); state.storage = "db"; state.ready = true; state.dbMsg = "";
    if (changed) render();
  }
  function applyPerfil(snap) {
    if (snap.exists) { state.perfil = Object.assign({}, state.perfil, snap.data()); lsSet("taf.perfil", state.perfil); }
    state.perfilLoaded = true; render();
  }
  function watchRemote() {
    var migrated = false;
    function applyAny(snap) {
      if (!migrated) {
        migrated = true;
        // registros feitos enquanto o app estava sem conexão com o banco sobem agora
        if (state.storage === "local") state.sessoes.filter(function (x) { return String(x.id).charAt(0) === "l"; }).forEach(function (x) { var o = Object.assign({}, x); delete o.id; sessCol.doc().set(o); });
      }
      applySnap(snap);
    }
    // leitura direta: não depende da escuta em tempo real
    function errTxt(e) { return e ? [e.code, e.message].filter(Boolean).join(" · ") || String(e) : "desconhecido"; }
    function readNow() {
      if (!sessCol) return;
      sessCol.get().then(applyAny).catch(function (e) {
        if (state.storage !== "db") { state.dbMsg = "Erro ao ler os registros: " + errTxt(e); render(); }
      });
      // o perfil é lido à parte: se falhar, os registros continuam funcionando
      perfilRef.get().then(applyPerfil).catch(function (e) {
        state.perfilLoaded = true;
        if (state.storage !== "db") { state.dbMsg = (state.dbMsg ? state.dbMsg + " | " : "") + "Erro ao ler o perfil: " + errTxt(e); render(); }
      });
    }
    try {
      sessCol.onSnapshot(applyAny, function () {});
      perfilRef.onSnapshot(applyPerfil, function () { state.perfilLoaded = true; });
    } catch (e) {}
    readNow();
    document.addEventListener("visibilitychange", function () { if (!document.hidden) readNow(); });
    window.addEventListener("focus", readNow);
    setInterval(function () { if (!document.hidden) readNow(); }, 20000);
  }
  function startRemote(uid) {
    var base = "data/users/" + uid;
    perfilRef = db.doc(base + "/perfil");
    sessCol = db.collection(base + "/perfil/sessoes");
    watchRemote();
  }

  function saveSessao(obj, id) {
    if (state.storage === "db") {
      var ref = id ? sessCol.doc(id) : sessCol.doc(), rid = ref.id;
      return ref.set(obj).then(function () {
        var list = state.sessoes.filter(function (x) { return x.id !== rid; });
        list.push(Object.assign({ id: rid }, obj)); state.sessoes = list; lsSet("taf.sessoes", list);
      });
    }
    var list = state.sessoes.slice();
    if (id) { list = list.map(function (s) { return s.id === id ? Object.assign({ id: id }, obj) : s; }); }
    else { list.push(Object.assign({ id: "l" + Date.now() }, obj)); }
    state.sessoes = list; lsSet("taf.sessoes", list); return Promise.resolve();
  }
  function removeSessao(id) {

  function chartSvg(t) {
    var I = info(t), sr = I.sr;
    if (!sr.length) return '<div class="empty">Ainda não há registros de ' + esc(t.nome.toLowerCase()) + '. Lance um resultado na aba Registrar.</div>';
    var W = 340, H = 190, L = 40, R = 14, T = 16, B = 28, pw = W - L - R, ph = H - T - B;
    var vals = sr.map(function (p) { return p.v; }).concat([I.m]);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = (hi - lo) * 0.18 || Math.abs(hi) * 0.1 || 1; lo -= pad; hi += pad;
    function X(i) { return sr.length === 1 ? L + pw / 2 : L + (pw * i) / (sr.length - 1); }
    function Y(v) { return T + ph - ((v - lo) / (hi - lo)) * ph; }
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Evolução em ' + esc(t.nome) + '">';
    for (var g = 0; g <= 3; g++) {
      var gv = lo + ((hi - lo) * g) / 3, gy = Y(gv);
      out += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '"/><text class="axis" x="' + (L - 6) + '" y="' + (gy + 4) + '" text-anchor="end">' + fmt(gv, t.dec === 0 && (hi - lo) < 6 ? 1 : t.dec) + "</text>";
    }
    var my = Y(I.m);
    out += '<line class="meta-l" x1="' + L + '" x2="' + (W - R) + '" y1="' + my + '" y2="' + my + '"/><text class="meta-t" x="' + (W - R) + '" y="' + (my - 5) + '" text-anchor="end">meta ' + fmt(I.m, t.dec) + "</text>";
    var pts = sr.map(function (p, i) { return X(i) + "," + Y(p.v); });
    if (sr.length > 1) {
      out += '<polygon class="area" points="' + X(0) + "," + (T + ph) + " " + pts.join(" ") + " " + X(sr.length - 1) + "," + (T + ph) + '"/><polyline class="ln" points="' + pts.join(" ") + '"/>';
    }
    sr.forEach(function (p, i) {
      var last = i === sr.length - 1;
      out += '<circle class="pt' + (last ? " last" : "") + '" cx="' + X(i) + '" cy="' + Y(p.v) + '" r="' + (last ? 6 : 4.5) + '"/>';
      if (sr.length <= 8 || last) out += '<text class="val" x="' + X(i) + '" y="' + (Y(p.v) + (p.v >= I.m === (t.dir === 1) ? -11 : 18)) + '" text-anchor="middle">' + fmt(p.v, t.dec) + "</text>";
      if (sr.length <= 7 || i === 0 || last || i % Math.ceil(sr.length / 5) === 0) out += '<text class="axis" x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + fdate(p.d) + "</text>";
    });
    return out + "</svg>";
  }

  var ICON = {
    painel: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',

  };
  var NAMES = { painel: "Painel", registrar: "Registrar", historico: "Histórico", metas: "Metas" };

  function render() {
    var app = document.getElementById("app"), y = window.scrollY;

    var loading = !state.ready || (state.storage === "db" && !state.perfilLoaded);

    if (loading) body = header() + '<div class="card empty">Carregando seus registros…</div>';
    else if (onb) body = onboarding();
    // não reconstrói formulários enquanto a pessoa digita
    var typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && (state.tab === "registrar" || state.tab === "metas") && app.firstChild && state.lastTab === state.tab && state.skipRender;
    if (typing) return;
    app.innerHTML = body;
    state.lastTab = state.tab;

  // ---------- Eventos ----------
  document.addEventListener("focusin", function (ev) { state.skipRender = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName); });
  document.addEventListener("focusout", function () { state.skipRender = false; });

  function go(tab) { state.tab = tab; state.msg = null; state.confirmDel = null; if (tab !== "registrar") state.editId = null; state.skipRender = false; render(); window.scrollTo(0, 0); }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act, id = b.dataset.id;
    if (a === "tab") return go(id);
    if (a === "sel") { state.sel = id; return render(); }
    if (a === "sexo") { var p = Object.assign({}, state.perfil, { sexo: b.dataset.v }); savePerfil(p); return render(); }
    if (a === "edit") { state.editId = id; state.tab = "registrar"; state.msg = null; state.skipRender = false; render(); return window.scrollTo(0, 0); }
    if (a === "cancelEdit") return go("historico");
    if (a === "retryDb") { state.dbMsg = "Conectando à sua conta…"; render(); connectDb(); return dbWatchdog(); }
    if (a === "crMode") { if (CR.running || CR.pre > 0) return; CR.mode = id; CR.acc = 0; CR.done = false; return render(); }
    if (a === "crPre") { CR.usePre = b.checked; return; }
    if (a === "crDefault") { if (CR.running || CR.pre > 0) return; CR.cfg[CR.mode] = CRD[CR.mode]; lsSet("taf.cron", CR.cfg); CR.acc = 0; CR.done = false; return render(); }
    if (a === "fotoDel") { var q = Object.assign({}, state.perfil); delete q.foto; state.msg = null; savePerfil(q).then(render); return render(); }
    if (a === "crToggle") return crToggle();
    if (a === "crReset") return crReset();
    if (a === "export") return exportCsv();
    if (a === "juntar") return juntar();

    if (a === "resetMetas") { savePerfil(Object.assign({}, state.perfil, { metas: {} })).then(function () { state.msg = { k: "ok", t: "Metas do edital 2021 restauradas.", w: "metas" }; render(); }); return; }
    if (a === "askDel") { state.confirmDel = id; return render(); }

  });

  function fotoErro(t) { state.msg = { k: "err", t: t, w: "foto" }; state.skipRender = false; render(); }
  function fotoLer(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onerror = function () { fotoErro("Não foi possível ler a imagem."); };
    fr.onload = function () {
      var im = new Image();
      im.onerror = function () { fotoErro("Esse arquivo não é uma imagem válida."); };
      im.onload = function () {
        try {
          var S = 192, w = im.naturalWidth, h = im.naturalHeight, m = Math.min(w, h), c = document.createElement("canvas");
          c.width = S; c.height = S;
          c.getContext("2d").drawImage(im, (w - m) / 2, (h - m) / 2, m, m, 0, 0, S, S);
          var url = c.toDataURL("image/jpeg", 0.82);
          state.msg = { k: "ok", t: "Foto salva.", w: "foto" }; state.skipRender = false;
          savePerfil(Object.assign({}, state.perfil, { foto: url })).then(render).catch(function () { fotoErro("Não foi possível salvar a foto."); });
        } catch (e) { fotoErro("Não foi possível processar a imagem."); }
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "imp") { var f0 = ev.target.files && ev.target.files[0]; ev.target.value = ""; return importFile(f0); }
    if (ev.target.id === "p-foto") return fotoLer(ev.target.files && ev.target.files[0]);
    var el = ev.target, k = el.dataset && el.dataset.cfg; if (!k) return;
    var n = Math.round(Number(String(el.value).replace(",", "."))), key = k === "pre" ? "pre" : CR.mode;
    var lo = k === "pre" ? 1 : 5, hi = k === "pre" ? 30 : 3600;
    if (CR.running || CR.pre > 0) { el.value = k === "pre" ? crPreN() : crDur() / 1000; return; }
    if (!isFinite(n) || n < lo) n = lo; if (n > hi) n = hi;
    CR.cfg[key] = n; el.value = n; lsSet("taf.cron", CR.cfg);
    if (k !== "pre") { CR.acc = 0; CR.done = false; }
    crUpdate();
  });

  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.id === "form") {
      var data = document.getElementById("f-data").value, o = { data: data, tipo: document.getElementById("f-tipo").value, obs: document.getElementById("f-obs").value.trim() }, any = false, bad = null;
      TESTS.forEach(function (t) {
        var raw = document.getElementById("f-" + t.id).value.trim().replace(",", ".");
        if (raw === "") { o[t.id] = null; return; }
        var n = Number(raw);
        if (!isFinite(n) || n <= 0) { bad = t.nome; return; }
        o[t.id] = n; any = true;
      });
      state.skipRender = false;
      if (!isoOk(data)) { state.msg = { k: "err", t: "Escolha a data do treino." }; return render(); }
      if (bad) { state.msg = { k: "err", t: "Valor inválido em " + bad + ". Use um número maior que zero ou deixe em branco." }; return render(); }
      if (!any) { state.msg = { k: "err", t: "Preencha pelo menos um teste." }; return render(); }
      var wasEdit = state.editId, saveId = state.editId, merged = false;
      if (!saveId) {
        var ex = state.sessoes.filter(function (x) { return x.data === o.data && (x.tipo || "Treino") === o.tipo; })[0];
        if (ex) {
          TESTS.forEach(function (t) { if (o[t.id] == null) o[t.id] = typeof ex[t.id] === "number" ? ex[t.id] : null; });
          o.obs = [ex.obs, o.obs].filter(function (x, i, a) { return x && a.indexOf(x) === i; }).join(" · ");
          saveId = ex.id; merged = true;
        }
      }
      saveSessao(o, saveId).then(function () {
        state.editId = null; state.msg = { k: "ok", t: wasEdit ? "Registro atualizado." : merged ? "Adicionado ao treino de " + fdate(o.data, true) + ". Tudo do mesmo dia fica junto." : "Registro salvo. O Painel já mostra o novo resultado." };
        state.tab = wasEdit ? "historico" : "registrar"; if (wasEdit) state.msg = null; render(); window.scrollTo(0, 0);
      }).catch(function () { state.msg = { k: "err", t: "Não foi possível salvar. Tente de novo." }; render(); });
    }
    if (ev.target.id === "metasForm") {
      var metasObj = {}, erro = null; state.skipRender = false;
      TESTS.forEach(function (t) {
        ["m", "f"].forEach(function (k) {
          var raw = document.getElementById("m-" + k + "-" + t.id).value.trim().replace(",", ".");
          if (raw === "") return;
          var n = Number(raw);
          if (!isFinite(n) || n <= 0) { erro = t.nome; return; }
          if (n !== t[k]) { metasObj[t.id] = metasObj[t.id] || {}; metasObj[t.id][k] = n; }
        });
      });
      if (erro) { state.msg = { k: "err", t: "Valor inválido em " + erro + ". Use um número maior que zero.", w: "metas" }; return render(); }
      savePerfil(Object.assign({}, state.perfil, { metas: metasObj })).then(function () { state.msg = { k: "ok", t: "Metas salvas. O Painel já usa os novos valores.", w: "metas" }; render(); })
        .catch(function () { state.msg = { k: "err", t: "Não foi possível salvar. Tente de novo.", w: "metas" }; render(); });
      return;
    }
    if (ev.target.id === "faixasForm") {
      var kk = state.perfil.sexo === "f" ? "f" : "m", allFx = JSON.parse(JSON.stringify(state.perfil.faixasV2 || {})), err2 = null; state.skipRender = false;
      TESTS.forEach(function (t) {
        if (err2) return;
        var prev = t[kk], arr = [], def = t.fx[kk];
        for (var i = 0; i < 6; i++) {
          var raw = document.getElementById("fx-" + i + "-" + t.id).value.trim().replace(",", "."), n = raw === "" ? def[i] : Number(raw);
          if (!isFinite(n) || n <= 0) { err2 = t.nome + " (" + fp(PTS[i]) + " pts): valor inválido."; return; }
          if (t.dir === 1 ? n <= prev : n >= prev) { err2 = t.nome + ": " + fp(PTS[i]) + " pts precisa ser " + (t.dir === 1 ? "maior" : "menor") + " que o valor anterior."; return; }
          arr.push(n); prev = n;
        }
        allFx[t.id] = allFx[t.id] || {}; allFx[t.id][kk] = arr;
      });
      if (err2) { state.msg = { k: "err", t: err2, w: "faixas" }; return render(); }
      savePerfil(Object.assign({}, state.perfil, { faixasV2: allFx })).then(function () { state.msg = { k: "ok", t: "Faixas salvas. O Painel já usa os novos valores.", w: "faixas" }; render(); })
        .catch(function () { state.msg = { k: "err", t: "Não foi possível salvar. Tente de novo.", w: "faixas" }; render(); });
      return;
    }
    if (ev.target.id === "onb") {
      var nome = document.getElementById("o-nome").value.trim();
      state.skipRender = false;
      if (!nome) { state.msg = { k: "err", t: "Digite seu nome para começar.", w: "onb" }; return render(); }
      var np = { nome: nome, sexo: document.getElementById("o-sexo").value, objetivo: document.getElementById("o-obj").value.trim(), inicio: today(), configurado: true };
      state.msg = null;
      savePerfil(np).then(function () { state.tab = "painel"; render(); }).catch(function () { state.msg = { k: "err", t: "Não foi possível salvar. Tente de novo.", w: "onb" }; render(); });
      return;
    }
    if (ev.target.id === "perfil") {
      var p = Object.assign({}, state.perfil, { nome: document.getElementById("p-nome").value.trim(), objetivo: document.getElementById("p-obj").value.trim(), inicio: document.getElementById("p-ini").value, prova: document.getElementById("p-prova").value });
      state.skipRender = false;
      savePerfil(p).then(function () { state.msg = { k: "ok", t: "Perfil salvo.", w: "perfil" }; render(); });
    }
  });

  // ---------- Início ----------
  loadLocal();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js"); } catch (e) {}
})();
</script>
